# Lockscreen (substitui o antigo fortune.sh + i3lock)
general {
    hide_cursor = true
}

background {
    monitor =
    path = screenshot
    blur_passes = 3
    blur_size = 6
    brightness = 0.6
}

# Logo do Arch
image {
    monitor =
    path = ~/.Lock/ArchLinux.png
    size = 180
    border_size = 0
    position = 0, 160
    halign = center
    valign = center
}

# Fortune (uma frase nova por bloqueio)
label {
    monitor =
    text = cmd[update:3600000] fortune -s
    color = rgba(EAE4D1ff)
    font_size = 16
    font_family = Iosevka Medium
    position = 0, 30
    halign = center
    valign = center
}

input-field {
    monitor =
    size = 260, 50
    outline_thickness = 2
    dots_size = 0.2
    dots_spacing = 0.2
    fade_on_empty = true
    placeholder_text = <i>Senha...</i>
    position = 0, -80
    halign = center
    valign = center
}
